# Example ArgoCD Smoke Tests
# 
# This file defines smoke tests to validate a new ArgoCD control plane
# before migrating production workloads to it.
#
# Usage:
#   python3 scripts/validation/argocd_validate.py \
#       --tests-file examples/validation/example-smoke-tests.yaml \
#       --argo-instance new-control-plane \
#       --active-only

config:
  # ArgoCD server URL
  argoServer: argocd.new.example.com
  
  # Login arguments (--sso, --username admin --password xyz, etc.)
  loginArgs: --sso
  
  # Default Git repository
  repoURL: git@github.com:yourorg/k8s-deployments.git
  
  # Default branch/tag
  targetRevision: main
  
  # Default ArgoCD project
  project: default
  
  # Default destination namespace
  destinationNamespace: default
  
  # Optional: Commands to run before validation
  preCommands:
    - echo "Starting ArgoCD validation"
  
  # Optional: Bootstrap repos that don't exist yet
  # Uncomment if the new ArgoCD instance doesn't have repo access
  # bootstrapRepos:
  #   - repoURL: git@github.com:yourorg/k8s-deployments.git
  #     repoName: k8s-deployments-smoke
  #     cleanup: true
  #     secret:
  #       namespace: argocd
  #       name: github-ssh-key
  #       kubeContext: existing-cluster

tests:
  # Test 1: Basic connectivity to in-cluster
  - name: busybox-in-cluster
    argoInstance: new-control-plane
    active: true
    destinationServer: https://kubernetes.default.svc
    destinationNamespace: default
    path: examples/busybox
    # Uses config defaults for repoURL, targetRevision, project

  # Test 2: Connectivity to remote cluster
  - name: busybox-remote-cluster
    argoInstance: new-control-plane
    active: true
    destinationServer: https://cluster-1.example.com
    destinationNamespace: smoke-test
    path: examples/busybox
  
  # Test 3: Different repository
  - name: nginx-test
    argoInstance: new-control-plane
    active: true
    destinationServer: https://kubernetes.default.svc
    destinationNamespace: default
    path: examples/nginx
    repoURL: git@github.com:yourorg/other-repo.git
    targetRevision: v1.0.0
  
  # Test 4: Inactive test (skipped unless --active-only is omitted)
  - name: disabled-test
    argoInstance: new-control-plane
    active: false
    destinationServer: https://kubernetes.default.svc
    destinationNamespace: default
    path: examples/test-app
  
  # Test 5: Different ArgoCD instance (filtered out if --argo-instance doesn't match)
  - name: other-instance-test
    argoInstance: other-control-plane
    active: true
    destinationServer: https://kubernetes.default.svc
    destinationNamespace: default
    path: examples/busybox
