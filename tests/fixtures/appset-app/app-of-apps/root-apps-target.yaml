apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root.apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://git-server.default.svc.cluster.local:3000/gitea/test-repo.git
    targetRevision: HEAD
    path: app-of-apps/clusters/target-argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
