apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-cluster.guestbook
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://git-server.default.svc.cluster.local:3000/gitea/test-repo.git
    targetRevision: HEAD
    path: apps/guestbook
  destination:
    name: workload-cluster
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
