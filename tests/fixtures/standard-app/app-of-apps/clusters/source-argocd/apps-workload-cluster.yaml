apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-cluster.apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/tracking-id: "root.apps:kustomize:app-of-apps/clusters/source-argocd"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://git-server.default.svc.cluster.local:3000/gitea/test-repo.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
